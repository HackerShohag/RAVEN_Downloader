clickable_minimum_required: 8.0.0
builder: cmake
kill: qmlscene

framework: ubuntu-touch-24.04-1.x

image_setup:
  run:
    - apt update
    - apt install -y python3-pip build-essential yasm nasm pkg-config

# Keep the commands in a file. In container mode Clickable wraps inline
# commands in `bash -c "..."`, which truncates an inline script containing
# quotes before it can install the embedded dependencies.
postbuild: bash ${ROOT}/scripts/embed-dependencies.sh
