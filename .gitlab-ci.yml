---
###############################################################################
# Define defaults and template anchors
###############################################################################
variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_DRIVER: overlay2
  CLICKABLE_VERSION: "8"
  UT_VERSION: "24.04-1.x"

default:
  image: "clickable/ci-dev-ut$UT_VERSION-amd64:$CLICKABLE_VERSION"

###############################################################################
# Define stages
###############################################################################
stages:
- build
- publish

###############################################################################
# `build` stage: build the click for specific architectures
###############################################################################
build:arm64:
  stage: build
  image: "clickable/ci-dev-ut$UT_VERSION-arm64:$CLICKABLE_VERSION"
  script:
  - clickable build --arch arm64
  artifacts:
    paths:
    - build/aarch64-linux-gnu/app/*.click
    expire_in: 1 week

build:amd64:
  stage: build
  image: "clickable/ci-dev-ut$UT_VERSION-amd64:$CLICKABLE_VERSION"
  script:
  - clickable build --arch amd64
  artifacts:
    paths:
    - build/x86_64-linux-gnu/app/*.click
    expire_in: 1 week

build:armhf:
  stage: build
  image: "clickable/ci-dev-ut$UT_VERSION-armhf:$CLICKABLE_VERSION"
  script:
  - clickable build --arch armhf
  artifacts:
    paths:
    - build/arm-linux-gnueabihf/app/*.click
    expire_in: 1 week

###############################################################################
# `release` stage: upload to OpenStore on tags
###############################################################################
publish:arm64:
  stage: publish
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - 'clickable publish --arch arm64 -- "$CI_COMMIT_MESSAGE"'
  dependencies:
  - build:arm64
  artifacts:
    paths:
    - build/aarch64-linux-gnu/app/*.click
    expire_in: 1 month

publish:amd64:
  stage: publish
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - 'clickable publish --arch amd64 -- "$CI_COMMIT_MESSAGE"'
  dependencies:
  - build:amd64
  artifacts:
    paths:
    - build/x86_64-linux-gnu/app/*.click
    expire_in: 1 month

publish:armhf:
  stage: publish
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - 'clickable publish --arch armhf -- "$CI_COMMIT_MESSAGE"'
  dependencies:
  - build:armhf
  artifacts:
    paths:
    - build/arm-linux-gnueabihf/app/*.click
    expire_in: 1 month
